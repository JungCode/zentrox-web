mutation UpdateWorkflowNode(
  $workflowId: ID!
  $nodeId: ID!
  $input: UpdateWorkflowNodeInput!
) {
  updateWorkflowNode(workflowId: $workflowId, nodeId: $nodeId, input: $input) {
    id
    createdAt
    updatedAt
    workflowVersionId
    integrationAccountId
    nodeType
    providerApp
    actionKey
    label
    positionX
    positionY
    configJson
    connectionStatus
    lastTestedAt
    testErrorMessage
  }
}
