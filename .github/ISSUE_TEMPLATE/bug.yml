name: Bug report
description: Report a reproducible problem in Zentrox Web
title: "[Bug]: "
labels:
  - bug
  - area:web
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe the user-visible problem and why it matters.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces it.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective conditions that must be true when fixed.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: State what must not change as part of this fix.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or logs
      description: Remove secrets and personal data before attaching evidence.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, route, build, or other relevant context.
    validations:
      required: false
