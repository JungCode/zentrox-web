query WorkflowVersionNodeSamples($workflowVersionId: ID!, $currentNodeId: ID!) {
  workflowVersionNodeSamples(
    workflowVersionId: $workflowVersionId
    currentNodeId: $currentNodeId
  ) {
    nodeId
    nodeLabel
    nodeType
    providerApp
    actionKey
    connectionStatus
    sampleRecord {
      id
      createdAt
      updatedAt
      workflowNodeId
      data
      fetchedAt
    }
  }
}
